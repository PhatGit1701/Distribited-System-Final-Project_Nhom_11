spring:
  datasource:
    url: ${TRACKER_DB_URL}
    username: ${TRACKER_DB_USER}
    password: ${TRACKER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
