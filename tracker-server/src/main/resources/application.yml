server:
  port: ${TRACKER_PORT:8080}
spring:
  datasource:
    url: ${TRACKER_DB_URL:jdbc:h2:file:./tracker-data/tracker}
    username: ${TRACKER_DB_USER:sa}
    password: ${TRACKER_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
tracker:
  jwt:
    secret: ${TRACKER_JWT_SECRET:}
    ttl-seconds: ${TRACKER_JWT_TTL:3600}
